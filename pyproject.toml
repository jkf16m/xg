[project]
name = "xg"
version = "0.1.0"
description = "A terminal agent for coding tasks that decides before it writes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "klip" }]
keywords = [
    "tui",
    "agent",
    "llm",
    "coding-agent",
    "textual",
    "langgraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "textual>=8.2",
    "rich>=15",
    # LangGraph builds the decision tree: `xg_project.graph.langgraph_tree`
    # declares nodes and branches, then compiles once after every extension has
    # registered. Pinned to 1.x for the `StateGraph`/`START`/`END` API this code
    # is written against.
    "langgraph>=1.2",
    # Jev is the driver: `xg_project.jev` imports `AsyncTypeSafeClient`. It is
    # the async client because a synchronous call inside a Textual message
    # handler would freeze the interface for the length of a round trip.
    "typesafe-sdk>=0.6",
    # The command line is click's: `xg_project.commands` splits `/go FILTER` and
    # checks the arguments, and is driven in-process through `standalone_mode=False`
    # rather than as a program, because a command typed into the TUI must be
    # answered without leaving it. Already present transitively; named here because
    # depending on a package that arrives by accident is a bug waiting to happen.
    "click>=8.2",
    # The executor speaks OpenRouter's OpenAI-compatible API directly, so it
    # needs an HTTP client. httpx's async client is what the SDK already uses
    # underneath, and `xg_project.llm` holds one connection open across
    # proposals the same way Jev holds its TypeSafe connection open.
    "httpx>=0.28",
    # `xg_project.read` matches .gitignore and .xgignore with
    # `pathspec.GitIgnoreSpec` rather than by hand, because gitignore syntax has
    # enough corners (negation, anchoring, directory-only patterns) that a
    # reimplementation is a bug farm. Under-declared until the wheel was built:
    # it was present in the development environment transitively, so every test
    # passed while a clean install could not import the package at all.
    "pathspec>=0.12",
]

[project.optional-dependencies]
# Everything needed to run the suite, lint it, and build and check a release:
# `pip install -e '.[dev]'`.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=6",
]

[project.urls]
# Fill these in before the first upload; PyPI shows them on the project page.
# Repository = "https://github.com/<owner>/xg"
# Issues = "https://github.com/<owner>/xg/issues"

[project.scripts]
xg = "xg_project.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_project"]

[tool.hatch.build.targets.sdist]
# What a source distribution carries: the package, the tests that prove it, and
# the files a reader of it needs. `.venv`, the caches and `dist/` are excluded by
# `.gitignore`, which hatchling honours.
include = [
    "/src/xg_project",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/.xgignore",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
# `pythonpath` keeps the src layout importable without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
# asyncio_mode=auto runs the Textual pilot tests, which are async, directly.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
