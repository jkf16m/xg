[project]
name = "xg-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "klip", email = "user@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openrouter>=0.2.8",
    "pexpect>=4.9.0",
    "rich>=15.0.0",
]

[project.scripts]
xg = "xg_project:main"

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests requiring an API key",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
