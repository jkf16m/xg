[project]
name = "xg"
version = "0.1.0"
description = "A TUI for deterministic agents"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2",
    "rich>=15",
    # LangGraph builds the decision tree: `xg_project.graph.langgraph_tree`
    # declares nodes and branches, then compiles once after every extension has
    # registered. Pinned to 1.x for the `StateGraph`/`START`/`END` API this code
    # is written against.
    "langgraph>=1.2",
    # Jev is the driver: `xg_project.jev` imports `AsyncTypeSafeClient`. It is
    # the async client because a synchronous call inside a Textual message
    # handler would freeze the interface for the length of a round trip.
    "typesafe-sdk>=0.6",
]

[project.scripts]
xg = "xg_project.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xg_project"]

[tool.pytest.ini_options]
# `pythonpath` keeps the src layout importable without an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
# asyncio_mode=auto runs the Textual pilot tests, which are async, directly.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
